[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hetsim"
version = "261029.3"
description = "Tone-domain simulation of mixer, filter and amplifier chains (superheterodyne frequency planning, spurs, leakage)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
plot = ["matplotlib"]
yaml = ["pyyaml"]
desktop = ["PySide6>=6.5", "pyyaml"]
dev = ["pytest", "matplotlib", "pyyaml"]

[project.scripts]
hetsim = "hetsim.cli:main"

[project.gui-scripts]
hetsim-app = "hetsim.desktop.app:main"

[tool.setuptools.packages.find]
include = ["hetsim*"]

[tool.setuptools.package-data]
"hetsim.viewer" = ["static/*.html"]
