# A swept dual-conversion spectrum analyser with a detector and an X/Y display: open it in the desktop app.
#   python -m hetsim app examples/spectrum_analyser.yaml
name: spectrum analyser
blocks:
  ant:
    type: source
    tones:
    - name: RF
      freq: 92000000
      power: 1
      mute: true
    - name: BLK
      freq: 1000000000
      power: -9
  lpf:
    type: filter
    response: lowpass
    family: butter
    order: 3
    fc: 3400000000
    insertion_loss_db: 0.5
    max_rejection_db: 120
  lna:
    type: amplifier
    gain_db: 10
    oip3_dbm: 35
    reverse_isolation_db: 30
    harmonics: false
  lo1:
    type: source
    tones:
      - name: LO1
        freq: 4222000000
        power: 7
        band: [3200000000, 6400000000]
        mode: sweep
        points: 32
        spacing: log
  mix1:
    type: mixer
    conversion_loss_db: 6.5
    lo_rf_isolation_db: 40
    lo_if_isolation_db: 35
    rf_if_isolation_db: 30
    iip3_dbm: 15
    spur_table: ideal
    lo_drive_dbm: 7
    lo_drive_tolerance_db: 3
    lo_waveform: sine
  roof:
    type: filter
    response: bandpass
    family: butter
    order: 5
    f0: 3200000000
    bw: 100000000
    insertion_loss_db: 2
    max_rejection_db: 80
  lo2:
    type: source
    tones:
    - name: LO2
      freq: 3290000000
      power: 7
  mix2:
    type: mixer
    conversion_loss_db: 6.5
    lo_rf_isolation_db: 40
    lo_if_isolation_db: 35
    rf_if_isolation_db: 30
    iip3_dbm: 15
    spur_table: ideal
    lo_drive_dbm: 7
    lo_drive_tolerance_db: 3
    lo_waveform: sine
  iff:
    type: filter
    response: bandpass
    family: butter
    order: 5
    f0: 10000000
    bw: 16000000
    insertion_loss_db: 0
    max_rejection_db: 80
  ifamp:
    type: amplifier
    gain_db: 30
    oip3_dbm: 25
    reverse_isolation_db: 30
    harmonics: true
  amp1: {type: amplifier, gain_db: 10}
  amp2: {type: amplifier, gain_db: 10}
  amp3: {type: amplifier, gain_db: 10}
  det1: {type: detector, detect: peak}
  xy1: {type: xyplot}
settings: {}
wires:
  - [ant.out, lpf.in]
  - [lpf.out, lna.in]
  - [iff.out, ifamp.in]
  - [lo1.out, mix1.lo]
  - [lo2.out, mix2.lo]
  - [amp1.out, roof.in]
  - [mix2.if, amp2.in]
  - [amp2.out, iff.in]
  - [roof.out, amp3.in]
  - [amp3.out, mix2.rf]
  - [lna.out, mix1.rf]
  - [mix1.if, amp1.in]
  - [ifamp.out, det1.in]
  - [det1.out, xy1.y]
  - [lo1.sweep, xy1.x]
layout:
  ant: {x: 0, y: 0}
  lpf: {x: 140, y: 0}
  lna: {x: 300, y: 0}
  lo1: {x: 340, y: -200}
  mix1: {x: 420, y: 0}
  roof: {x: 640, y: 0}
  lo2: {x: 780, y: -100}
  mix2: {x: 860, y: 0}
  iff: {x: 1050, y: 0}
  ifamp: {x: 1180, y: 0}
  amp1: {x: 540, y: 0}
  amp2: {x: 960, y: 0}
  amp3: {x: 740, y: 0}
  det1: {x: 1320, y: 0}
  xy1: {x: 1400, y: -140}
