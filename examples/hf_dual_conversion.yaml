# Up-converting HF receiver from examples/hf_single_vs_dual.py, for the viewer:
#   python -m hetsim view examples/hf_dual_conversion.yaml
name: HF dual conversion (45 MHz / 455 kHz)
blocks:
  ant:
    type: source
    tones:
    - name: RF
      freq: 7100000.0
      power: -73.0
    - name: BLK
      freq: 7150000.0
      power: -20.0
  lpf:
    type: filter
    response: lowpass
    family: ellip
    order: 7
    fc: 30MHz
    ripple_db: 0.1
    stop_db: 70
    insertion_loss_db: 0.5
    max_rejection_db: 120.0
  lna:
    type: amplifier
    gain_db: 10
    oip3_dbm: 35
    reverse_isolation_db: 30.0
    harmonics: true
  lo1:
    type: source
    tones:
    - name: LO1
      freq: 52100000.0
      power: 7.0
  mix1:
    type: mixer
    conversion_loss_db: 6.5
    lo_rf_isolation_db: 40
    lo_if_isolation_db: 35
    rf_if_isolation_db: 30
    iip3_dbm: 15
    spur_table: dbm_generic
    lo_drive_dbm: 7
    lo_drive_tolerance_db: 3.0
  roof:
    type: filter
    response: bandpass
    family: butter
    order: 4
    f0: 45000000.0
    bw: 15kHz
    ripple_db: 0.5
    stop_db: 60.0
    insertion_loss_db: 2
    max_rejection_db: 80
  if1amp:
    type: amplifier
    gain_db: 12
    oip3_dbm: 30
    reverse_isolation_db: 30.0
    harmonics: true
  lo2:
    type: source
    tones:
    - name: LO2
      freq: 45455000.0
      power: 7.0
  mix2:
    type: mixer
    conversion_loss_db: 6.5
    lo_rf_isolation_db: 40
    lo_if_isolation_db: 35
    rf_if_isolation_db: 30
    iip3_dbm: 15
    spur_table: dbm_generic
    lo_drive_dbm: 7
    lo_drive_tolerance_db: 3.0
  iff:
    type: filter
    response: bandpass
    family: cheby1
    order: 5
    f0: 455000.0
    bw: 6kHz
    ripple_db: 0.5
    stop_db: 60.0
    insertion_loss_db: 0.0
    max_rejection_db: 80
  ifamp:
    type: amplifier
    gain_db: 30
    oip3_dbm: 25
    reverse_isolation_db: 30.0
    harmonics: true
wires:
- - ant.out
  - lpf.in
- - lpf.out
  - lna.in
- - lna.out
  - mix1.rf
- - mix1.if
  - roof.in
- - roof.out
  - if1amp.in
- - if1amp.out
  - mix2.rf
- - mix2.if
  - iff.in
- - iff.out
  - ifamp.in
- - lo1.out
  - mix1.lo
- - lo2.out
  - mix2.lo
